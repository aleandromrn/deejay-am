<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050816">
  <meta name="robots" content="noindex, nofollow">
  <title>Deejay AM | Site temporairement hors ligne</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --panel: #0c1326;
      --blue: #168bff;
      --text: #f5f8ff;
      --muted: #a8b4c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, rgba(22,139,255,.20), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 52px);
      text-align: center;
      background: rgba(12, 19, 38, .92);
      border: 1px solid rgba(69, 153, 255, .28);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .logo {
      margin: 0 0 28px;
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.08em;
    }
    .logo span { color: var(--blue); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 190, 80, .4);
      border-radius: 999px;
      color: #ffd28a;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffbd59;
      box-shadow: 0 0 12px rgba(255,189,89,.7);
    }
    h1 {
      margin: 24px 0 14px;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1.12;
    }
    p {
      margin: 0 auto;
      max-width: 440px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .rule {
      width: 64px;
      height: 3px;
      margin: 28px auto;
      border-radius: 3px;
      background: var(--blue);
    }
    footer {
      color: #74839c;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">DEEJAY <span>AM</span></div>
    <div class="status"><span class="dot" aria-hidden="true"></span> Maintenance temporaire</div>
    <h1>Notre site est temporairement hors ligne.</h1>
    <p>Nous travaillons actuellement sur le site afin de vous proposer une meilleure expérience. Merci pour votre patience. Deejay AM sera de retour prochainement.</p>
    <div class="rule" aria-hidden="true"></div>
    <footer>© <span id="year">2026</span> Deejay AM</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
