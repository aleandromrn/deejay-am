<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demande envoyée | Deejay AM</title>
  <meta name="theme-color" content="#08080c">
  <link rel="icon" href="logo.webp">
  <style>
    :root{
      --bg:#08080c;
      --panel:rgba(255,255,255,.055);
      --line:rgba(255,255,255,.10);
      --text:#f7f7f9;
      --muted:#b8b8c2;
      --gold:#d8b46b;
      --gold2:#f0d79d;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 15%,rgba(141,99,255,.18),transparent 30%),
        radial-gradient(circle at 80% 20%,rgba(216,180,107,.13),transparent 28%),
        #08080c;
    }
    .card{
      width:min(650px,100%);
      padding:38px;
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg,var(--panel),rgba(255,255,255,.025));
      box-shadow:0 30px 90px rgba(0,0,0,.45);
      text-align:center;
    }
    .logo{
      width:92px;
      height:92px;
      margin:0 auto 22px;
      border-radius:50%;
      object-fit:cover;
      border:1px solid var(--line);
    }
    .check{
      width:54px;
      height:54px;
      margin:0 auto 18px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:rgba(216,180,107,.12);
      border:1px solid rgba(216,180,107,.28);
      color:var(--gold2);
      font-size:28px;
      font-weight:900;
    }
    h1{
      margin:0 0 12px;
      font-size:clamp(34px,7vw,54px);
      line-height:1;
      letter-spacing:-.04em;
    }
    p{
      color:var(--muted);
      margin:0 auto 26px;
      max-width:520px;
      line-height:1.6;
    }
    .actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }
    a{
      text-decoration:none;
      display:inline-flex;
      min-height:48px;
      padding:0 20px;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      font-weight:800;
      border:1px solid var(--line);
      color:#fff;
    }
    .primary{
      color:#161108;
      border-color:transparent;
      background:linear-gradient(135deg,var(--gold2),var(--gold));
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.webp" alt="Logo Deejay AM">
    <div class="check">✓</div>
    <h1>Demande envoyée.</h1>
    <p>
      Merci. Tes informations ont bien été transmises à Deejay AM.
      Une réponse sera envoyée dès que possible.
    </p>
    <div class="actions">
      <a class="primary" href="https://deejayam.com/">Retour au site</a>
      <a href="https://www.instagram.com/deejay__am/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </main>
</body>
</html>
